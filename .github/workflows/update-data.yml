name: Update data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
    - cron: '30 15 * * *'
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]'
      - name: Crawl and verify
        id: verify
        run: |
          set -o pipefail
          vl crawl mega
          vl verify 2>&1 | tee verify.log
      - name: Open issue on failure
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('verify.log') ? fs.readFileSync('verify.log', 'utf8') : 'No log captured';
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: 'Data update failed', body: 'Fail-safe: no data commit was made.\n\n```\n' + body.slice(-6000) + '\n```'});
      - name: Commit only after verification
        if: success()
        run: |
          git config user.name vietlott-lab-bot
          git config user.email actions@users.noreply.github.com
          git add data
          git diff --cached --quiet || git commit -m 'data: update verified results'
          git push
